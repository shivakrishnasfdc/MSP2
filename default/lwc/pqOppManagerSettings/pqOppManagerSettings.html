<template>
    <lightning-card variant="Narrow" title="Opportunity Manager Settings" icon-name="utility:settings"> </lightning-card>
    <div class="container">
    <div class="tabsection">
    <ul class="slds-vertical-tabs__nav" role="tablist" aria-orientation="vertical">
    <li class={gentabclass} title="General" role="presentation">
      <a class="slds-vertical-tabs__link" href="#" role="tab" tabindex="0" aria-selected={isGeneral} aria-controls="slds-vertical-tabs-0" id="slds-vertical-tabs-0__nav" onclick={handleGenTabClick}>
        <span class="slds-vertical-tabs__left-icon"></span>
        <span class="slds-truncate" title="General">General</span>
        <span class="slds-vertical-tabs__right-icon"></span>
      </a>
    </li>
    <li class={rmtabclass} title="Relationship Map" role="presentation">
      <a class="slds-vertical-tabs__link" href="#" role="tab" tabindex="-1" aria-selected={isRelationshipMap} aria-controls="slds-vertical-tabs-1" id="slds-vertical-tabs-1__nav" onclick={handleRmTabClick}>
        <span class="slds-vertical-tabs__left-icon"></span>
        <span class="slds-truncate" title="Relationship Map">Relationship Map</span>
        <span class="slds-vertical-tabs__right-icon"></span>
      </a>
    </li>
    <li class={shtabclass} title="Schedule Jobs" role="presentation">
      <a class="slds-vertical-tabs__link" href="#" role="tab" tabindex="-1" aria-selected={isScheduleJobs} aria-controls="slds-vertical-tabs-1" id="slds-vertical-tabs-2__nav" onclick={handleShTabClick}>
        <span class="slds-vertical-tabs__left-icon"></span>
        <span class="slds-truncate" title="Schedule Jobs">Schedule Jobs</span>
        <span class="slds-vertical-tabs__right-icon"></span>
      </a>
    </li>
  </ul>
    </div>
    <div class="section datasection">
        <template if:true={isGeneral}>
    <div class="page-section page-main">
        <div class="slds-grid pro-grid slds-var-p-around_medium">
            <div class="slds-col">
                    <div class="pro-span-content slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                        <lightning-formatted-text
                            value={labels.daysOfDataDescription}
                        ></lightning-formatted-text>
                        <lightning-combobox
                            name="daysofdata"
                            label={labels.daysOfData}
                            value={days}
                            placeholder="Select Option"
                            options={options}
                            onchange={handleChange} >
                        </lightning-combobox>
                    </div>
            </div>
        </div>
        <div class="slds-grid pro-grid slds-var-p-around_medium">
            <div class="slds-col">
                <lightning-spinner if:false={loaded}></lightning-spinner>
                <template if:true={loaded}>
                    <div class="pro-span-content slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                        <lightning-formatted-text
                            value={labels.Toggle_Schedule_Tasks_Opportunity}
                        ></lightning-formatted-text>
                        <lightning-input
                            type="toggle"
                            variant="label-hidden"
                            checked={scheduledTaskOn}
                            disabled={scheduledTaskOn}
                            message-toggle-active={labels.On}
                            message-toggle-inactive={labels.Off}
                            onchange={handleScheduleToggled}
                        ></lightning-input>
                    </div>
                </template>
            </div>
        </div>
        <div class="slds-grid pro-grid slds-var-p-around_medium">
            <div class="slds-col">
                <lightning-spinner if:false={loaded}></lightning-spinner>
                <template if:true={loaded}>
                    <div class="pro-span-content slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                        <lightning-formatted-text
                            value={labels2.Toggle_AutoGenerate_OpportunityPlan}
                        ></lightning-formatted-text>
                        <lightning-input
                            type="toggle"
                            variant="label-hidden"
                            checked={oppPlanCreationEnabled}
                            message-toggle-active={labels.On}
                            message-toggle-inactive={labels.Off}
                            onchange={handleAutoGenerateOppPlan}
                        ></lightning-input>
                    </div>
                </template>
            </div>
        </div>
        <div class="slds-grid pro-grid slds-var-p-around_medium">
            <div class="slds-col">
                <lightning-spinner if:false={loaded}></lightning-spinner>
                <template if:true={loaded}>
                    <div class="pro-span-content slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                        <lightning-formatted-text
                            value="Run Test For Date"
                        ></lightning-formatted-text>
                        <lightning-input
                            type="date"
                            variant="label-hidden"
                            date-style="short"
                            value={today}
                            onchange={handleDateChanged}
                        ></lightning-input>
                    </div>
                </template>
            </div>
        </div>
    </div>
        </template>
        
    <p if:true={errorMessage} class="slds-text-color_error">
        <lightning-formatted-rich-text value={errorMessage}></lightning-formatted-rich-text>
    </p>
    <template if:true={isRelationshipMap}>
        <p>Select fields and colors to display on the Relationship Map</p>
            <lightning-layout>
                <lightning-layout-item size="7">
                    <div class="slds-m-top_medium">
                        <c-map-settings-display-fields
                            member-fields={orgChartFields}
                            loading={orgChartFieldsLoading}
                            ondisplayfieldchange={handleVisibilityChange}
                        ></c-map-settings-display-fields>
                    </div>
                    <div class="slds-m-top_medium">
                        <c-map-settings-feature-flags
                            setting-type="om"
                            auto-generate={autoGenerateMapFlag}
                            onautogeneratemapchange={handleAutoGenerateMapChange}
                            loading={featureFlagsLoading}
                        ></c-map-settings-feature-flags>
                    </div>
                    <div class="slds-m-top_medium">
                        <c-map-settings-default-values
                            type="om"
                            onsettingschange={passthroughEvent}
                        ></c-map-settings-default-values>
                    </div>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" size="5">
                    <c-map-settings-field-selection
                        if:false={objectsLoading}
                        fields={objects}
                        loading={objectsLoading}
                        onfieldtoggled={handleFieldToggled}
                    ></c-map-settings-field-selection>
                </lightning-layout-item>
            </lightning-layout>
    </template>

    <template if:true={isScheduleJobs}>
        <div class="page-section page-main">
        <div class="slds-grid pro-grid slds-var-p-around_medium">
            <div class="slds-col">
                <lightning-spinner if:false={loaded}></lightning-spinner>
                <template if:true={loaded}>
                    <div class="pro-span-content slds-grid_vertical-align-center slds-p-vertical_xxx-small">
                        <lightning-formatted-text
                            value={labels2.Toggle_Schedule_OpportunityPlan_Creation}
                        ></lightning-formatted-text>
                        <lightning-button variant="brand" label="Start" title="Start" disabled={isBatchStarted} onclick={handleScheduleOpportunityPlanCreation} 
                        class="slds-m-left_x-small"></lightning-button>
                    </div>
                </template>
            </div>
        </div>
        </div>
    </template>
    </div>
    </div>
</template>
